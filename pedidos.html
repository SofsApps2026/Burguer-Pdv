<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f0f0f"><title>Pa’ qué cocino burgués · Pide en línea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d62718;--yel:#ffc400;--ink:#111;--bg:#f6f4f0;--mut:#6b6b6b;--ln:#e8e4dc;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font:15px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.sg{font-family:'Space Grotesk',Inter,sans-serif}
.hero{background:radial-gradient(900px 300px at 85% -20%,#d6271899,transparent),#0f0f0f;color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 22px}
.hero .in{max-width:900px;margin:auto}.logo{display:inline-block;background:var(--yel);color:#111;font:700 12px 'Space Grotesk';padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.hero h1{font-size:30px;line-height:1.05;margin:10px 0 6px}.hero h1 b{color:var(--yel)}.hero p{color:#cfcfcf}
.st{display:inline-flex;gap:6px;align-items:center;margin-top:12px;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px}.st.o{background:#1c8a3a}.st.c{background:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chips span,.chips a{background:#ffffff18;border:1px solid #ffffff22;color:#fff;text-decoration:none;padding:6px 11px;border-radius:20px;font-size:13px}
.aviso{background:var(--yel);color:#111;font-weight:600;text-align:center;padding:9px 14px;font-size:14px}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
nav div{max-width:900px;margin:auto;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav a{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#f0ede7;color:#111;text-decoration:none;font-weight:600;font-size:14px}nav a.on{background:var(--ink);color:#fff}
main{max-width:900px;margin:auto;padding:6px 14px}main h2{font-size:22px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;display:flex;gap:12px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px #0001}.card:active{transform:scale(.99)}
.card .t{flex:1;min-width:0}.card h3{font-size:17px}.card p{color:var(--mut);font-size:13px;margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font:700 17px 'Space Grotesk'}.img{width:104px;height:104px;border-radius:12px;background:linear-gradient(135deg,#ffe27a,#ff9d3d);display:flex;align-items:center;justify-content:center;font-size:44px;flex:none;position:relative;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}.add{position:absolute;right:6px;bottom:6px;background:var(--red);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:none}
.bar button{max-width:900px;margin:auto;display:flex;width:100%;justify-content:space-between;align-items:center}
button{font:inherit;border:0;cursor:pointer}.bp{background:var(--red);color:#fff;font-weight:700;padding:15px 18px;border-radius:14px;font-size:16px;box-shadow:0 8px 24px #d6271850}.bp:disabled{background:#999;box-shadow:none}
.bg{background:#f0ede7;padding:10px 14px;border-radius:12px;font-weight:600}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sh{background:#fff;width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:22px}}
.sh .hd{position:sticky;top:0;background:#fff;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ln)}.sh .hd h3{font-size:19px}
.x{background:#f0ede7;width:34px;height:34px;border-radius:50%;font-size:18px}.bd{padding:14px 18px}.pimg{height:170px;background:linear-gradient(135deg,#ffe27a,#ff9d3d);display:flex;align-items:center;justify-content:center;font-size:70px}.pimg img{width:100%;height:100%;object-fit:cover}
.bd h4{margin:14px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.ch{display:inline-block;margin:3px 4px 3px 0;padding:9px 14px;border-radius:20px;border:1.5px solid var(--ln);background:#fff;cursor:pointer;font-weight:500}.ch.on{background:var(--yel);border-color:var(--yel);font-weight:700}.ch.off{background:#f3f3f3;color:#999;text-decoration:line-through}
input,textarea,select{width:100%;padding:13px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;background:#fff;margin:4px 0}input:focus,textarea:focus{outline:0;border-color:var(--ink)}
label{font-weight:600;font-size:13px;color:#444;display:block;margin-top:8px}
.qty{display:flex;align-items:center;gap:12px}.qty button{width:36px;height:36px;border-radius:50%;background:#f0ede7;font-size:20px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.row small{display:block;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg div,.opt{border:1.5px solid var(--ln);border-radius:14px;padding:12px;text-align:center;cursor:pointer;font-weight:600}.seg div.on,.opt.on{border-color:var(--red);background:#fff1ef}
.opt{text-align:left;margin:6px 0}.opt small{display:block;font-weight:400;color:var(--mut)}
.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .g{font:700 20px 'Space Grotesk';border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.steps{display:flex;margin:18px 0}.steps div{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative}.steps i{display:block;width:30px;height:30px;border-radius:50%;background:#e4e0d8;margin:0 auto 6px;line-height:30px;font-style:normal;font-weight:700}
.steps .d i{background:#1c8a3a;color:#fff}.steps .a i{background:var(--yel);color:#111;box-shadow:0 0 0 5px #ffc40040}.steps .d,.steps .a{color:#111;font-weight:600}
.note{background:#fff8dc;border-radius:12px;padding:12px;font-size:13px;margin-top:8px}.err{color:var(--red);font-weight:600;font-size:13px;margin-top:6px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:26px 14px}
</style></head><body>
<header class="hero"><div class="in"><span class="logo">🍔 PIDE EN LÍNEA</span><h1>Pa’ qué cocino <b>burgués</b></h1><p id="tag">Hamburguesas hechas al momento, a tu puerta o para recoger.</p><div id="st"></div><div class="chips" id="chips"></div></div></header>
<div id="aviso"></div><nav><div id="cats"></div></nav>
<main id="menu"><div class="empty">Cargando menú…</div></main>
<footer>© Pa’ qué cocino burgués · Hecho con 🔥</footer>
<div class="bar" id="bar"><button class="bp" id="barb"></button></div>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyAHkQGio2oabojLpr4PrksXan5OlJXGB2k",authDomain:"burguer-35b44.firebaseapp.com",databaseURL:"https://burguer-35b44-default-rtdb.firebaseio.com",projectId:"burguer-35b44",storageBucket:"burguer-35b44.firebasestorage.app",messagingSenderId:"79752295503",appId:"1:79752295503:web:9548c9c06d90175acc263a"}));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const EMO=c=>/papa/i.test(c)?'🍟':/beb|refr|agua|malt/i.test(c)?'🥤':/hamb|burg/i.test(c)?'🍔':'🍽️';
let I={},P=[],A=[],cart=[],tipo='domicilio',pago='efectivo',geo=null,unT=null,F={};
const open=()=>I.abierto!==false&&I.abierto!=='0'&&I.abierto!==0;
const sub=()=>cart.reduce((s,i)=>s+i.u*i.q,0),env=()=>tipo==='domicilio'?Number(I.envio)||0:0;
const wa=(t)=>{let w=String(I.whats||'').replace(/\D/g,'');if(w.length===10)w='52'+w;return w?'https://wa.me/'+w+(t?'?text='+encodeURIComponent(t):''):''};

onValue(ref(db,'menuPublico'),s=>{const v=s.val()||{};I=v.info||{};P=Object.values(v.productos||{}).sort((a,b)=>(a.o||0)-(b.o||0));A=Object.values(v.aderezos||{});hero();menu();bar()},()=>{$('#menu').innerHTML='<div class="empty">No pudimos cargar el menú. Revisa tu conexión e intenta de nuevo.</div>'});

function hero(){
 $('#st').innerHTML=open()?'<span class="st o">● Abierto · recibiendo pedidos</span>':'<span class="st c">● Cerrado por ahora</span>';
 const c=[];if(I.tiempo)c.push('⏱ '+esc(I.tiempo));if(Number(I.envio)>=0&&I.envio!==undefined&&I.envio!=='')c.push('🛵 Envío '+(Number(I.envio)?M(I.envio):'gratis'));if(I.horario)c.push('🕒 '+esc(I.horario));
 if(I.dir)c.push(I.maps?'<a href="'+esc(I.maps)+'" target="_blank" rel="noopener">📍 '+esc(I.dir)+'</a>':'<span>📍 '+esc(I.dir)+'</span>');
 if(wa())c.push('<a href="'+wa('Hola, tengo una duda sobre mi pedido')+'" target="_blank" rel="noopener">💬 WhatsApp</a>');
 const mine=LS('pqcb_pedido');if(mine)c.push('<a href="#" id="mine">📦 Ver mi pedido</a>');
 $('#chips').innerHTML=c.map(x=>x.startsWith('<')?x.replace(/^<span>/,'<span>'):'<span>'+x+'</span>').join('');
 const m=$('#mine');if(m)m.onclick=e=>{e.preventDefault();track(mine)};
 $('#aviso').innerHTML=I.msg?'<div class="aviso">'+esc(I.msg)+'</div>':'';
}
function menu(){
 if(!P.length){$('#menu').innerHTML='<div class="empty">Estamos preparando el menú. ¡Vuelve en un momento! 🍔</div>';$('#cats').innerHTML='';return}
 const cs=[...new Set(P.map(p=>p.cat||'Menú'))];
 $('#cats').innerHTML=cs.map((c,i)=>'<a href="#c'+i+'" class="'+(i?'':'on')+'">'+EMO(c)+' '+esc(c)+'</a>').join('');
 $('#menu').innerHTML=cs.map((c,i)=>'<h2 id="c'+i+'">'+esc(c)+'</h2><div class="grid">'+P.filter(p=>(p.cat||'Menú')===c).map(p=>'<div class="card" data-p="'+esc(p.id)+'"><div class="t"><h3>'+esc(p.n)+'</h3><p>'+esc(p.desc||(p.ing||[]).join(', '))+'</p><div class="pr">'+M(p.p)+'</div></div><div class="img">'+(p.foto?'<img loading="lazy" src="'+esc(p.foto)+'" alt="">':EMO(c))+(open()?'<span class="add">+</span>':'')+'</div></div>').join('')+'</div>').join('');
 document.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>prod(e.dataset.p));
 document.querySelectorAll('#cats a').forEach(a=>a.onclick=()=>{document.querySelectorAll('#cats a').forEach(x=>x.classList.remove('on'));a.classList.add('on')});
}
function bar(){const n=cart.reduce((s,i)=>s+i.q,0);$('#bar').style.display=n?'block':'none';$('#barb').innerHTML='<span>🛒 Ver mi pedido ('+n+')</span><b>'+M(sub())+'</b>';$('#barb').onclick=checkout}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('on');$('#sh').scrollTop=0}
function close(){$('#ov').classList.remove('on');if(unT){unT();unT=null}}
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
const head=(t,back)=>'<div class="hd"><h3>'+t+'</h3><button class="x" id="cl">✕</button></div>';
const bindX=()=>{const x=$('#cl');if(x)x.onclick=close};

function prod(id){
 const p=P.find(x=>x.id===id);if(!p)return;const S={sin:new Set(),con:new Set(),q:1,nota:''},ing=p.ing||[];
 const d=()=>{const t=p.p*S.q;
  sheet('<div class="pimg">'+(p.foto?'<img src="'+esc(p.foto)+'" alt="">':EMO(p.cat))+'</div>'+head(esc(p.n))+'<div class="bd"><p style="color:#555">'+esc(p.desc||'')+'</p><div class="pr" style="margin-top:6px">'+M(p.p)+'</div>'+
  (ing.length?'<h4>Lleva · toca para quitar</h4>'+ing.map(i=>'<span class="ch '+(S.sin.has(i)?'off':'on')+'" data-k="sin" data-v="'+esc(i)+'">'+esc(i)+'</span>').join(''):'')+
  (A.length&&!/beb/i.test(p.cat||'')?'<h4>Aderezos</h4>'+A.map(i=>'<span class="ch '+(S.con.has(i)?'on':'')+'" data-k="con" data-v="'+esc(i)+'">'+esc(i)+'</span>').join(''):'')+
  '<h4>Indicaciones</h4><textarea id="nt" rows="2" placeholder="Ej. sin picante, bien cocida…">'+esc(S.nota)+'</textarea>'+
  '<div style="display:flex;gap:12px;align-items:center;margin-top:14px"><div class="qty"><button id="m">−</button><b>'+S.q+'</b><button id="pl">+</button></div><button class="bp" id="ok" style="flex:1" '+(open()?'':'disabled')+'>'+(open()?'Agregar · '+M(t):'Cerrado por ahora')+'</button></div></div>');
  bindX();const k=()=>S.nota=$('#nt').value;
  document.querySelectorAll('.ch').forEach(e=>e.onclick=()=>{k();const s=S[e.dataset.k],v=e.dataset.v;s.has(v)?s.delete(v):s.add(v);d()});
  $('#m').onclick=()=>{k();S.q=Math.max(1,S.q-1);d()};$('#pl').onclick=()=>{k();S.q++;d()};
  $('#ok').onclick=()=>{k();if(!open())return;const it={cod:p.id,n:p.n,q:S.q,u:Number(p.p),sin:[...S.sin],con:[...S.con],nota:S.nota.trim()};
   const key=JSON.stringify([it.cod,it.sin,it.con,it.nota]);const ex=cart.find(c=>c.key===key);ex?ex.q+=it.q:cart.push({...it,key});close();bar()};
 };d();
}
const dsc=i=>[(i.sin||[]).length?'Sin: '+i.sin.join(', '):'',(i.con||[]).length?'Con: '+i.con.join(', '):'',i.nota?'📝 '+i.nota:''].filter(Boolean).join(' · ');

function checkout(){
 if(!cart.length){close();return}
 const dom=tipo==='domicilio',min=Number(I.min)||0,ok=open()&&sub()>=min;
 sheet(head('Tu pedido')+'<div class="bd">'+cart.map((i,x)=>'<div class="row"><div><b>'+i.q+'× '+esc(i.n)+'</b><small>'+esc(dsc(i))+'</small></div><div style="text-align:right"><b>'+M(i.u*i.q)+'</b><div class="qty" style="margin-top:4px"><button data-d="'+x+'" data-s="-1">−</button><button data-d="'+x+'" data-s="1">+</button></div></div></div>').join('')+
 '<h4>¿Cómo lo quieres?</h4><div class="seg"><div data-t="domicilio" class="'+(dom?'on':'')+'">🛵 A domicilio</div><div data-t="recoger" class="'+(dom?'':'on')+'">🏪 Recoger en tienda</div></div>'+
 (dom?'':'<div class="note">📍 Recoges en: <b>'+esc(I.dir||'la tienda')+'</b>'+(I.maps?' · <a href="'+esc(I.maps)+'" target="_blank" rel="noopener">Ver mapa</a>':'')+'</div>')+
 '<h4>Tus datos</h4><input id="fn" placeholder="Nombre *" autocomplete="name" value="'+esc(F.n||'')+'"><input id="ft" type="tel" placeholder="Teléfono / WhatsApp *" autocomplete="tel" value="'+esc(F.t||'')+'">'+
 (dom?'<input id="fd" placeholder="Calle, número y colonia *" autocomplete="street-address" value="'+esc(F.d||'')+'"><input id="fr" placeholder="Referencias (color de casa, entre calles…)" value="'+esc(F.r||'')+'"><button class="bg" id="gps" style="width:100%">'+(geo?'✅ Ubicación adjuntada':'📍 Usar mi ubicación actual')+'</button>':'')+
 '<h4>Forma de pago</h4>'+[['efectivo','💵 Efectivo','Paga al recibir'],['transferencia','🏦 Transferencia','Te damos los datos al confirmar'],['tarjeta','💳 Tarjeta','Con terminal al entregar']].map(([k,t,s])=>'<div class="opt '+(pago===k?'on':'')+'" data-g="'+k+'">'+t+'<small>'+s+'</small></div>').join('')+
 (pago==='efectivo'?'<input id="fp" type="number" inputmode="decimal" placeholder="¿Con cuánto pagas? (opcional)" value="'+esc(F.p||'')+'">':'')+
 '<h4>Notas del pedido</h4><textarea id="fo" rows="2" placeholder="Algo más que debamos saber">'+esc(F.o||'')+'</textarea>'+
 '<div class="tot" style="margin-top:14px"><div><span>Subtotal</span><span>'+M(sub())+'</span></div>'+(dom?'<div><span>Envío</span><span>'+(env()?M(env()):'Gratis')+'</span></div>':'')+'<div class="g"><span>Total</span><span>'+M(sub()+env())+'</span></div></div>'+
 '<div class="err" id="er">'+(!open()?'Estamos cerrados por ahora.':sub()<min?'Pedido mínimo '+M(min)+'.':'')+'</div><button class="bp" id="go" style="width:100%;margin-top:12px" '+(ok?'':'disabled')+'>Enviar pedido · '+M(sub()+env())+'</button></div>');
 bindX();
 const sv=()=>{F={n:$('#fn').value,t:$('#ft').value,d:($('#fd')||{}).value||F.d,r:($('#fr')||{}).value||F.r,p:($('#fp')||{}).value||F.p,o:$('#fo').value}};
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sv();const i=cart[b.dataset.d];i.q+=Number(b.dataset.s);if(i.q<=0)cart.splice(b.dataset.d,1);bar();checkout()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sv();tipo=b.dataset.t;checkout()});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{sv();pago=b.dataset.g;checkout()});
 if($('#gps'))$('#gps').onclick=()=>{navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{geo={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};sv();checkout()},()=>{$('#er').textContent='No pudimos obtener tu ubicación. Escribe tu dirección.'},{enableHighAccuracy:true,timeout:10000}):0};
 $('#go').onclick=async()=>{sv();const n=F.n.trim(),t=F.t.replace(/\D/g,''),d=(F.d||'').trim();
  if(!n||t.length<10||(dom&&!d)){$('#er').textContent='Completa tu nombre, un teléfono de 10 dígitos'+(dom?' y tu dirección.':'.');return}
  $('#go').disabled=true;$('#go').textContent='Enviando…';
  const id='P'+Date.now().toString(36)+[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const o={ts:Date.now(),estado:'nuevo',nombre:n,tel:t,tipo,pago,items:cart.map(({key,...r})=>r),sub:sub(),envio:env(),total:sub()+env()};
  if(dom){o.dir=d;if((F.r||'').trim())o.ref=F.r.trim();if(geo)o.geo=geo}
  if(pago==='efectivo'&&Number(F.p)>0)o.paga=Number(F.p);if((F.o||'').trim())o.nota=F.o.trim();
  try{await set(ref(db,'pedidos/'+id),JSON.parse(JSON.stringify(o)));cart=[];bar();LS('pqcb_pedido',id);hero();track(id)}
  catch(e){$('#go').disabled=false;$('#go').textContent='Reintentar';$('#er').textContent='No se pudo enviar. Revisa tu conexión o escríbenos por WhatsApp.'}};
}

function track(id){
 sheet(head('Tu pedido')+'<div class="bd"><div class="empty">Cargando…</div></div>');bindX();
 if(unT)unT();
 unT=onValue(ref(db,'pedidos/'+id),s=>{const o=s.val();if(!o){LS('pqcb_pedido',null);close();hero();return}
  const dom=o.tipo==='domicilio',L=['Recibido','Preparando',dom?'En camino':'Listo para recoger','Entregado'],E=['nuevo','preparando','listo','entregado'],a=E.indexOf(o.estado);
  const msg={nuevo:'Recibimos tu pedido. En un momento lo confirmamos.',preparando:'¡Estamos preparando tu pedido! 🍔🔥',listo:dom?'Tu pedido va en camino 🛵':'Tu pedido está listo, pasa por él 🏪',entregado:'¡Buen provecho! Gracias por tu preferencia 💛',cancelado:'Tu pedido fue cancelado. Escríbenos por WhatsApp si tienes dudas.'}[o.estado]||'';
  if(o.estado==='entregado'||o.estado==='cancelado')LS('pqcb_pedido',null);
  $('#sh').innerHTML=head('Pedido #'+id.slice(-4).toUpperCase())+'<div class="bd">'+(o.estado==='cancelado'?'<div class="note" style="background:#ffe7e4">'+msg+'</div>':'<div class="steps">'+L.map((l,i)=>'<div class="'+(i<a||o.estado==='entregado'?'d':i===a?'a':'')+'"><i>'+(i<a||o.estado==='entregado'?'✓':i+1)+'</i>'+l+'</div>').join('')+'</div><div class="note" style="text-align:center;font-weight:600">'+msg+'</div>')+
  '<h4>Resumen</h4>'+(o.items||[]).map(i=>'<div class="row"><div><b>'+i.q+'× '+esc(i.n)+'</b><small>'+esc(dsc(i))+'</small></div><b>'+M(i.u*i.q)+'</b></div>').join('')+
  '<div class="tot" style="margin-top:10px">'+(o.envio?'<div><span>Envío</span><span>'+M(o.envio)+'</span></div>':'')+'<div class="g"><span>Total</span><span>'+M(o.total)+'</span></div></div>'+
  '<div class="note">'+(dom?'🛵 A domicilio: '+esc(o.dir):'🏪 Recoger en: '+esc(I.dir||'tienda'))+'<br>Pago: '+esc(o.pago)+'</div>'+
  (o.pago==='transferencia'&&I.transf?'<div class="note" style="background:#e8f4ff"><b>Datos para tu transferencia</b><br>'+esc(I.transf).replace(/\n/g,'<br>')+'<br><small>Envíanos tu comprobante por WhatsApp.</small></div>':'')+
  (wa()?'<a class="bp" style="display:block;text-align:center;text-decoration:none;margin-top:12px" href="'+wa('Hola, sobre mi pedido #'+id.slice(-4).toUpperCase())+'" target="_blank" rel="noopener">💬 Escribir por WhatsApp</a>':'')+
  (o.estado==='entregado'||o.estado==='cancelado'?'<button class="bg" id="nw" style="width:100%;margin-top:10px">Hacer otro pedido</button>':'')+'</div>';
  bindX();const nw=$('#nw');if(nw)nw.onclick=close;
 },()=>{$('#sh').innerHTML=head('Tu pedido')+'<div class="bd"><div class="empty">No pudimos cargar el estado. Intenta de nuevo.</div></div>';bindX()});
